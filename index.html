<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ServiceDue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="app-wrap">
    <div class="header-inner">
      <div class="wordmark">
        <span class="wordmark-name">ServiceDue</span>
        <span class="wordmark-rule"></span>
        <span class="wordmark-sub">Vehicle maintenance log</span>
      </div>
      <nav class="header-nav" role="tablist">
        <button class="nav-btn" role="tab" aria-selected="true"  data-tab="tab-dash">Vehicles</button>
        <button class="nav-btn" role="tab" aria-selected="false" data-tab="tab-hist">Service history</button>
        <button class="nav-btn" role="tab" aria-selected="false" data-tab="tab-search">Search repairs</button>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-btn" title="Toggle theme" aria-label="Toggle theme"></button>
        <button class="btn btn-primary" id="header-add">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Add vehicle
        </button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="app-wrap main-content">

    <section class="tab-panel active" id="tab-dash"   role="tabpanel"></section>
    <section class="tab-panel"        id="tab-hist"   role="tabpanel"></section>

    <section class="tab-panel" id="tab-search" role="tabpanel">
      <div class="search-header">
        <h2 class="hist-heading">Search repairs</h2>
        <p class="search-sub">Find past services by vehicle number, model, owner, service type or parts replaced.</p>
      </div>
      <div class="search-bar-wrap">
        <div class="search-input-wrap">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="search-input" class="search-input" type="search" placeholder="e.g. TN 09 AB 1234, oil filter, brake…" autocomplete="off" spellcheck="false">
          <button class="search-clear hide" id="search-clear" aria-label="Clear search">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="search-filters">
          <select id="sf-vehicle" class="hist-filter">
            <option value="">All vehicles</option>
          </select>
          <select id="sf-type" class="hist-filter">
            <option value="">All service types</option>
            <option>Regular service</option>
            <option>Oil change</option>
            <option>Brake service</option>
            <option>Tyre change</option>
            <option>Repair</option>
            <option>Other</option>
          </select>
          <select id="sf-sort" class="hist-filter">
            <option value="date-desc">Newest first</option>
            <option value="date-asc">Oldest first</option>
            <option value="cost-desc">Highest cost</option>
            <option value="cost-asc">Lowest cost</option>
            <option value="km-desc">Highest km</option>
          </select>
        </div>
      </div>
      <div id="search-results"></div>
    </section>

  </div>
</main>

<!-- Vehicle dialog -->
<dialog id="v-dlg" aria-labelledby="v-dlg-title">
  <div class="dlg-header">
    <span class="dlg-title" id="v-dlg-title">Add vehicle</span>
    <button class="dlg-close" data-close-dlg aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <form id="v-form">
    <input type="hidden" name="vid">
    <div class="dlg-body">
      <div class="field">
        <label for="v-owner">Owner name</label>
        <input id="v-owner" name="owner" required placeholder="e.g. Arun Kumar">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="v-number">Vehicle number</label>
          <input id="v-number" name="number" required placeholder="TN 01 AB 1234">
        </div>
        <div class="field">
          <label for="v-model">Model</label>
          <input id="v-model" name="model" required placeholder="Honda Activa 6G">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="v-type">Vehicle type</label>
          <select id="v-type" name="vtype">
            <option>Two-wheeler</option>
            <option>Car</option>
            <option>Truck</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label for="v-year">Manufacturing year</label>
          <input id="v-year" name="year" type="number" min="1980" max="2100" required placeholder="2021">
        </div>
      </div>
      <div class="field">
        <label for="v-km">Current odometer reading (km)</label>
        <input id="v-km" name="km" type="number" min="0" required placeholder="24000">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="v-ikm">Service every (km)</label>
          <input id="v-ikm" name="intervalKm" type="number" min="100" value="5000" required>
        </div>
        <div class="field">
          <label for="v-im">Service every (months)</label>
          <input id="v-im" name="intervalMonths" type="number" min="1" value="6" required>
        </div>
      </div>
    </div>
    <div class="dlg-footer">
      <button type="button" class="btn btn-ghost" data-close-dlg>Cancel</button>
      <button type="submit" class="btn btn-primary">Save vehicle</button>
    </div>
  </form>
</dialog>

<!-- Service log dialog -->
<dialog id="s-dlg" aria-labelledby="s-dlg-title">
  <div class="dlg-header">
    <span class="dlg-title" id="s-dlg-title">Log a service</span>
    <button class="dlg-close" data-close-dlg aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <form id="s-form">
    <input type="hidden" name="svid">
    <div class="dlg-body">
      <div class="field-row">
        <div class="field">
          <label for="s-date">Service date</label>
          <input id="s-date" name="sdate" type="date" required>
        </div>
        <div class="field">
          <label for="s-km">Odometer reading (km)</label>
          <input id="s-km" name="skm" type="number" min="0" required>
        </div>
      </div>
      <div class="field">
        <label for="s-type">Service type</label>
        <select id="s-type" name="stype">
          <option>Regular service</option>
          <option>Oil change</option>
          <option>Brake service</option>
          <option>Tyre change</option>
          <option>Repair</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label for="s-parts">Parts replaced</label>
        <input id="s-parts" name="sparts" placeholder="e.g. Engine oil, air filter">
      </div>
      <div class="field">
        <label for="s-cost">Cost (₹)</label>
        <input id="s-cost" name="scost" type="number" min="0" value="0">
      </div>
    </div>
    <div class="dlg-footer">
      <button type="button" class="btn btn-ghost" data-close-dlg>Cancel</button>
      <button type="submit" class="btn btn-primary">Save service</button>
    </div>
  </form>
</dialog>

<div id="toast-wrap" aria-live="polite" aria-atomic="true"></div>

<script src="app.js"></script>
</body>
</html>
